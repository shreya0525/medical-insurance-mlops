stages:
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/insurance.csv
      - params.yaml
    outs:
      - data/processed/X_train.npy
      - data/processed/y_train.npy

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/X_train.npy
      - data/processed/y_train.npy
      - params.yaml
    outs:
      - models/logreg_model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/logreg_model.pkl
      - data/processed/X_train.npy
      - data/processed/y_train.npy
    outs:
      - metrics.txt
